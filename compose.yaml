services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staffan
      POSTGRES_PASSWORD: staffan
      POSTGRES_USER: staffan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffan -d staffan"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - staffan-postgres:/var/lib/postgresql/data

volumes:
  staffan-postgres:
