services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staffan
      POSTGRES_PASSWORD: staffan
      POSTGRES_USER: staffan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffan -d staffan"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - staffan-postgres:/var/lib/postgresql/data

  worker:
    profiles: ["eavrop"]
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://staffan:staffan@postgres:5432/staffan
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staffan-postgres:
