services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staffan
      POSTGRES_PASSWORD: staffan
      POSTGRES_USER: staffan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffan -d staffan"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - staffan-verify-postgres:/var/lib/postgresql/data

  model-gateway:
    image: node:24-alpine
    command: ["node", "/opt/test-gateway.mjs"]
    volumes:
      - ./docker/test-gateway.mjs:/opt/test-gateway.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  portal-fixture:
    image: node:24-alpine
    command: ["node", "/opt/test-eavrop.mjs"]
    volumes:
      - ./docker/test-eavrop.mjs:/opt/test-eavrop.mjs:ro
      - ${MAILBOX_TEST_CERT_DIR:?MAILBOX_TEST_CERT_DIR is required}:/certs:ro
    networks:
      default:
        aliases: [mailbox-fixture.e-avrop.com]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://staffan:staffan@postgres:5432/staffan
    command: ["node", "packages/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      DATABASE_URL: postgres://staffan:staffan@postgres:5432/staffan
      MODEL_GATEWAY_URL: http://model-gateway:4100/extract
      MODEL_NAME: deterministic-docker-test
      MODEL_VERSION: "1"
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:?OPERATOR_USERNAME is required}
      OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:?OPERATOR_PASSWORD_HASH is required}
      AUTH_COOKIE_SECURE: "false"
      MAILBOX_INGRESS_TOKEN: ${MAILBOX_INGRESS_TOKEN:?MAILBOX_INGRESS_TOKEN is required}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://staffan:staffan@postgres:5432/staffan
      MODEL_GATEWAY_URL: http://model-gateway:4100/extract
      MODEL_NAME: deterministic-docker-test
      MODEL_VERSION: "1"
      EAVROP_USERNAME: fixture-user
      EAVROP_PASSWORD: fixture-password
      EAVROP_BROWSER_EXECUTABLE_PATH: /opt/test-chromium.sh
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
      WORKER_IMPORT_MAX_ATTEMPTS: "1"
    volumes:
      - ./docker/test-chromium.sh:/opt/test-chromium.sh:ro
      - ${MAILBOX_TEST_CERT_DIR:?MAILBOX_TEST_CERT_DIR is required}:/certs:ro
    depends_on:
      api:
        condition: service_healthy
      portal-fixture:
        condition: service_healthy

  mailbox-acceptance:
    profiles: [acceptance]
    build:
      context: .
      target: api
    command: ["node", "packages/ingress/mailbox-e2e.mjs"]
    environment:
      DATABASE_URL: postgres://staffan:staffan@postgres:5432/staffan
      API_BASE_URL: http://api:3001
      WEB_BASE_URL: http://web:3000
      PORTAL_STATS_URL: http://portal-fixture:4101/stats
      BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:?OPERATOR_USERNAME is required}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?OPERATOR_PASSWORD is required}
      MAILBOX_INGRESS_TOKEN: ${MAILBOX_INGRESS_TOKEN:?MAILBOX_INGRESS_TOKEN is required}
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_started

  web:
    build:
      context: .
      target: web
    environment:
      AUTH_COOKIE_SECURE: "false"
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  staffan-verify-postgres:
